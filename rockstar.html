<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Rockstar Match — Playable Ad</title>
<!--
  PLAYABLE AD — single file, no external requests (fonts/CDN/images all inline).
  Wire the real click-through in doInstall(): replace the toast with your
  network macro, e.g.  mraid.open(CLICK_URL)  |  ExitApi.exit()  |  FbPlayableAd.onCTAClick()
-->
<style>
  :root{
    --ink:#120822; --plum:#2a1450; --magenta:#ff2e8b; --cyan:#19e3ff;
    --gold:#ffce4d; --mint:#3dffb0; --white:#fff;
    --board:#1b0d33;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overscroll-behavior:none;touch-action:manipulation;}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:#05030c; color:var(--white);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden; user-select:none;
  }
  /* ---------- STAGE ---------- */
  .wrap{
    position:relative; width:min(100vw,520px); height:100dvh; margin:0 auto;
    overflow:hidden;
    background:
      radial-gradient(120% 70% at 50% -10%, #4a1d7a 0%, var(--plum) 38%, var(--ink) 78%);
    display:flex; flex-direction:column;
  }
  .spot{position:absolute; top:-12%; width:46%; height:90%; pointer-events:none; mix-blend-mode:screen; filter:blur(2px); opacity:.55;}
  .spot.l{left:2%;  background:linear-gradient(180deg,#ff2e8b88, #ff2e8b00 70%); transform:skewX(16deg); transform-origin:top; }
  .spot.r{right:2%; background:linear-gradient(180deg,#19e3ff88, #19e3ff00 70%); transform:skewX(-16deg); transform-origin:top; }
  /* spotlights kept static: animating a blurred + screen-blended half-screen layer froze low-end phones */
  .crowd{position:absolute; left:0; right:0; bottom:0; height:14%;
    background:radial-gradient(80% 120% at 50% 100%, #000 30%, transparent 70%);
    pointer-events:none;}

  /* ---------- HUD ---------- */
  .hud{position:relative; z-index:3; display:flex; align-items:center; gap:8px;
    padding:calc(10px + env(safe-area-inset-top)) 12px 4px;}
  .avatar{width:clamp(38px,10.5vmin,52px);height:clamp(38px,10.5vmin,52px);border-radius:50%;flex:0 0 auto;
    display:grid;place-items:center;font-size:clamp(18px,5.5vmin,26px);
    background:radial-gradient(circle at 35% 30%,#fff7,#7a2eff 60%,#3a1268);
    border:3px solid var(--gold); box-shadow:0 0 16px #ffce4d66;}
  .chip{flex:1; min-width:0; background:#0c0620cc; border:2px solid #ffffff22; border-radius:14px;
    padding:6px clamp(6px,2vmin,10px); display:flex; align-items:center; justify-content:center; gap:8px;}
  .chip .lab{font-size:clamp(8px,2.4vmin,10px);letter-spacing:.12em;text-transform:uppercase;color:#cbb8ff;display:block;}
  .chip .val{font-size:clamp(16px,5vmin,22px);font-weight:900;line-height:1;}
  .target .big{font-size:clamp(18px,5.6vmin,26px);}
  .target .count{font-weight:900;font-size:clamp(15px,4.6vmin,20px);}
  .target.done{border-color:var(--mint); box-shadow:0 0 14px #3dffb088;}
  .moves .val{color:var(--gold);}
  .mute{flex:0 0 auto;width:clamp(36px,10vmin,46px);height:clamp(36px,10vmin,46px);border-radius:14px;
    border:2px solid #ffffff22;background:#0c0620cc;color:#fff;font-size:clamp(15px,4.4vmin,18px);cursor:pointer;line-height:1;
    display:flex;align-items:center;justify-content:center;}
  .mute:active{transform:scale(.94);}
  .mute.off{color:#ff8a8a;border-color:#ff8a8a55;}
  .moves.low .val{color:#ff5f6d; animation:blink .6s steps(2) infinite;}
  @keyframes blink{50%{opacity:.35;}}

  /* ---------- HYPE METER ---------- */
  .hype{position:relative; z-index:3; margin:6px 14px 2px; height:12px; border-radius:8px;
    background:#0c0620; border:2px solid #ffffff22; overflow:hidden;}
  .hype>i{display:block;height:100%;width:0%;border-radius:6px;
    background:linear-gradient(90deg,var(--magenta),var(--gold),var(--cyan));
    transition:width .25s ease;}
  .hype-tag{position:relative;z-index:3;text-align:center;font-size:9px;letter-spacing:.25em;
    color:#9f86d8;text-transform:uppercase;margin-top:3px;}

  /* ---------- BOARD ---------- */
  .stage{position:relative; z-index:3; flex:1 1 auto; min-height:0; display:flex; align-items:center; justify-content:center; touch-action:none;
    padding:8px clamp(8px,3vmin,16px) calc(8px + env(safe-area-inset-bottom));}
  .board{
    position:relative; width:100%; aspect-ratio:6/7; max-width:100%; max-height:100%;
    display:grid; grid-template-columns:repeat(6,1fr); gap:6px;
    padding:8px; border-radius:18px; touch-action:none;
    background:linear-gradient(180deg,#241046,#160a2e);
    box-shadow:inset 0 2px 0 #ffffff22, inset 0 -8px 22px #00000088, 0 12px 30px #00000066;
  }
  .cell{
    aspect-ratio:1; border-radius:12px; display:grid; place-items:center;
    font-size:var(--sym, clamp(18px,7vw,32px));
    line-height:1; cursor:pointer; touch-action:none;
    box-shadow:inset 0 -3px 0 #00000033, 0 2px 4px #00000044;
    transition:transform .12s ease, box-shadow .12s ease, opacity .18s ease;
    filter:drop-shadow(0 1px 1px #0006);
  }
  .cell:active{transform:scale(.92);}
  .cell.dragging{transition:none; z-index:5; will-change:transform; box-shadow:0 8px 18px #000a, inset 0 -3px 0 #00000033;}
  .cell.sel{transform:scale(1.08); box-shadow:0 0 0 3px var(--gold), 0 0 16px var(--gold);}
  .cell.hint{animation:hint .7s ease-in-out infinite;}
  @keyframes hint{0%,100%{transform:scale(1);}50%{transform:scale(1.14);box-shadow:0 0 0 3px #fff8,0 0 14px #fff;}}
  .cell.pop{animation:pop .26s cubic-bezier(.2,1.4,.5,1);}
  @keyframes pop{0%{transform:translateY(-26px) scale(.4);opacity:0;}100%{transform:none;opacity:1;}}
  .cell.clear{animation:clr .15s ease forwards;}
  @keyframes clr{60%{transform:scale(1.25);}100%{transform:scale(0) rotate(40deg);opacity:0;}}
  .cell.shake{animation:shk .3s;}
  @keyframes shk{25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}

  .tutorhand{position:absolute;width:30px;height:30px;border-radius:50%;z-index:20;opacity:0;
    pointer-events:none;border:2px solid #fff;
    background:radial-gradient(circle at 35% 30%,#fffffff2,#ffffff66 58%,#ffffff00);
    box-shadow:0 2px 8px #0007;}
  .tutorhand .ring{position:absolute;inset:-7px;border-radius:50%;border:2px solid #fff;opacity:0;}
  .tutorhand.press .ring{animation:tring .55s ease;}
  @keyframes tring{0%{transform:scale(.45);opacity:.85;}100%{transform:scale(1.5);opacity:0;}}

  .fx-spark{position:absolute;width:8px;height:8px;border-radius:50%;z-index:18;pointer-events:none;
    margin-left:-4px;margin-top:-4px;will-change:transform,opacity;animation:spark .66s ease-out forwards;}
  .fx-spark.glyph{width:auto;height:auto;background:none!important;border-radius:0;
    font-size:18px;margin-left:-9px;margin-top:-11px;filter:drop-shadow(0 1px 1px #0007);}
  .fx-ring{position:absolute;width:46px;height:46px;border-radius:50%;border:3px solid #fff;
    margin-left:-23px;margin-top:-23px;z-index:17;pointer-events:none;animation:ringpop .5s ease-out forwards;}
  .fx-combo{position:absolute;z-index:19;pointer-events:none;font-weight:900;white-space:nowrap;
    text-transform:uppercase;letter-spacing:.02em;color:#fff;
    text-shadow:0 2px 0 #0007, 0 0 12px var(--gold);animation:floatup 1s ease-out forwards;}
  @keyframes ringpop{0%{transform:scale(.25);opacity:.85;}100%{transform:scale(1.75);opacity:0;}}
  @keyframes spark{0%{transform:translate(0,0) scale(1) rotate(0);opacity:1;}
    70%{opacity:1;}100%{transform:translate(var(--tx),var(--ty)) scale(.35) rotate(var(--rot));opacity:0;}}
  @keyframes floatup{0%{opacity:0;transform:translate(-50%,4px) scale(.7);}
    18%{opacity:1;transform:translate(-50%,-8px) scale(1.12);}
    100%{opacity:0;transform:translate(-50%,-46px) scale(1);}}

  .tip{position:relative;z-index:3;text-align:center;font-size:12px;color:#d8c9ff;
    padding:2px 0 10px;letter-spacing:.02em;}
  .tip b{color:var(--gold);}

  .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:5;}
  .flash.go{animation:fl .35s ease;}
  @keyframes fl{0%{opacity:.45;}100%{opacity:0;}}

  /* ---------- TOAST ---------- */
  .toast{position:absolute;left:50%;bottom:18%;transform:translateX(-50%) translateY(20px);
    z-index:8;background:#0c0620ee;border:2px solid var(--gold);color:#fff;pointer-events:none;
    padding:10px 16px;border-radius:12px;font-size:13px;font-weight:700;opacity:0;transition:.25s;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ---------- END CARD ---------- */
  .end{position:absolute;inset:0;z-index:9;display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;
    background:radial-gradient(120% 80% at 50% 30%, #3a1268f2, #05030cfa);
    backdrop-filter:blur(2px);}
  .end.show{display:flex;animation:fade .3s ease;}
  @keyframes fade{from{opacity:0;}to{opacity:1;}}
  .marquee{font-weight:900;text-transform:uppercase;letter-spacing:.02em;line-height:.95;
    font-size:clamp(30px,9vw,46px);
    background:linear-gradient(180deg,#fff,var(--gold) 55%,#ff9d2e);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    -webkit-text-stroke:1px #00000040;
    filter:drop-shadow(0 0 14px #ffce4d88);}
  .sub{font-size:15px;color:#e7ddff;max-width:18ch;margin-top:-4px;}
  .stars{font-size:22px;letter-spacing:4px;filter:drop-shadow(0 0 8px #ffce4d);}
  .reviews{font-size:11px;color:#bca9e8;margin-top:-8px;}
  .cta{margin-top:6px;border:0;cursor:pointer;font-weight:900;text-transform:uppercase;
    letter-spacing:.04em;font-size:20px;color:#2a0e00;
    padding:16px 34px;border-radius:16px;
    background:linear-gradient(180deg,#ffe07a,var(--gold) 40%,#ff9d2e);
    box-shadow:0 6px 0 #b86a00, 0 10px 24px #ff9d2e66;
    animation:cta 1.1s ease-in-out infinite;}
  @keyframes cta{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}
  .cta:active{transform:translateY(3px);box-shadow:0 3px 0 #b86a00;}
  .storebadges{display:flex;gap:8px;margin-top:2px;}
  .badge{font-size:10px;color:#cbb8ff;border:1px solid #ffffff33;border-radius:8px;padding:5px 9px;display:flex;gap:5px;align-items:center;}
  .replay{background:none;border:0;color:#cbb8ff;font-size:12px;text-decoration:underline;cursor:pointer;margin-top:4px;}
  .confetti{position:absolute;top:-10px;font-size:18px;animation:fall linear forwards;pointer-events:none;}
  @keyframes fall{to{transform:translateY(115vh) rotate(540deg);opacity:.2;}}
  .fw{position:absolute;border-radius:50%;pointer-events:none;z-index:26;will-change:transform,opacity;
    animation:fw var(--d,1s) ease-out forwards;}
  .fw.g{border-radius:0;background:none!important;font-size:20px;filter:drop-shadow(0 1px 2px #0008);}
  @keyframes fw{0%{transform:translate(0,0) scale(1);opacity:1;}70%{opacity:1;}
    100%{transform:translate(var(--tx),var(--ty)) scale(.4);opacity:0;}}
  .winflash{position:absolute;inset:0;z-index:24;pointer-events:none;background:#fff;animation:wflash 1.4s ease-out forwards;}
  @keyframes wflash{0%{opacity:.5;}30%{opacity:.1;}100%{opacity:0;}}
  .end.show .marquee{animation:winpop .6s cubic-bezier(.2,1.5,.4,1) both;}
  @keyframes winpop{0%{transform:scale(.3);opacity:0;}60%{transform:scale(1.14);}100%{transform:scale(1);opacity:1;}}

  .lb{position:absolute;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:18px;
    background:radial-gradient(120% 80% at 50% 22%,#2a1450f2,#05030cfa);backdrop-filter:blur(2px);}
  .lb.show{display:flex;animation:fade .3s ease;}
  .lb-card{width:100%;max-width:min(360px,92vw);max-height:94dvh;overflow:auto;background:#160a2e;border:2px solid #ffffff22;border-radius:18px;
    padding:16px 16px 16px;box-shadow:0 20px 50px #000a;animation:winpop .45s cubic-bezier(.2,1.3,.4,1) both;}
  .lb-title{text-align:center;font-weight:900;font-size:clamp(20px,6vmin,24px);margin:2px 0 12px;letter-spacing:.01em;
    background:linear-gradient(180deg,#fff,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .lb-head{display:grid;grid-template-columns:52px 1fr 64px;font-size:11px;letter-spacing:.1em;
    text-transform:uppercase;color:#b9a6e6;padding:0 8px 6px;border-bottom:1px solid #ffffff14;}
  .lb-head .pr{text-align:right;}
  .lb-rows{position:relative;overflow:hidden;margin-top:4px;}
  .lb-row{position:absolute;left:0;right:0;height:var(--rh,32px);display:grid;grid-template-columns:52px 1fr 64px;
    align-items:center;padding:0 8px;font-size:clamp(13px,3.7vmin,15px);border-radius:9px;color:#e9deff;
    transition:transform .5s cubic-bezier(.2,.8,.25,1), opacity .35s ease;}
  .lb-row .rk{color:#9f86d8;font-weight:700;}
  .lb-row .pts{text-align:right;font-weight:800;}
  .lb-row.you{background:linear-gradient(90deg,#ffce4d3a,#ffce4d12);
    box-shadow:inset 0 0 0 2px var(--gold), 0 0 18px #ffce4d66;}
  .lb-row.you .nm{color:var(--gold);font-weight:900;}
  .lb-row.you .rk{color:var(--gold);}
  .lb-row.pop{animation:rowpop .5s ease;}
  @keyframes rowpop{0%,100%{box-shadow:inset 0 0 0 2px var(--gold),0 0 18px #ffce4d66;}
    40%{box-shadow:inset 0 0 0 3px #fff,0 0 28px #ffce4daa;}}
  .lb-cta{margin-top:14px;width:100%;}

  .intro{position:absolute;inset:0;z-index:28;display:flex;align-items:center;justify-content:center;
    pointer-events:none;opacity:0;padding:24px;}
  .intro.show{animation:introShow 2.4s ease forwards;}
  @keyframes introShow{0%{opacity:0;}5%{opacity:1;}85%{opacity:1;}100%{opacity:0;}}
  .intro .banner{background:linear-gradient(180deg,#2a1450,#160a2e);border:2px solid var(--gold);
    border-radius:16px;padding:16px 22px;max-width:84%;text-align:center;line-height:1.25;
    font-weight:900;font-size:21px;color:#fff;box-shadow:0 14px 34px #000a, 0 0 22px #ffce4d55;
    animation:introPop .5s cubic-bezier(.2,1.4,.4,1);}
  .intro .banner b{color:var(--gold);}
  @keyframes introPop{0%{transform:scale(.6);}60%{transform:scale(1.05);}100%{transform:scale(1);}}
</style>

<div class="wrap" id="wrap">
  <div class="spot l"></div><div class="spot r"></div>
  <div class="crowd"></div>
  <div class="flash" id="flash"></div>
  <div class="intro" id="intro"><div class="banner">Match the instruments to <b>rock the song!</b> 🎸</div></div>

  <div class="hud">
    <div class="avatar">🎤</div>
    <div class="chip target" id="targetChip">
      <span class="big">🎵</span>
      <span><span class="lab">Matches</span><span class="count"><b id="col">0</b>/<span id="goal">10</span></span></span>
    </div>
    <div class="chip moves" id="timeChip">
      <span><span class="lab">Time</span><span class="val" id="time">0:30</span></span>
    </div>
    <button class="mute" id="muteBtn" onclick="toggleMute()" aria-label="Toggle sound">🔊</button>
  </div>

  <div class="hype"><i id="hypeBar"></i></div>
  <div class="hype-tag">🤘 Progress</div>

  <div class="stage"><div class="board" id="board"></div></div>

  <div class="toast" id="toast"></div>

  <div class="end" id="end">
    <div class="marquee" id="endTitle">You Headlined!</div>
    <div class="stars">★★★★★</div>
    <div class="reviews">4.8 · 312K reviews</div>
    <div class="sub" id="endSub">Hundreds more match-3 levels are waiting backstage.</div>
    <button class="cta" id="cta" onclick="doInstall()">▶ Play Free</button>
    <div class="storebadges">
      <span class="badge">⬇ App Store</span>
      <span class="badge">⬇ Google Play</span>
    </div>
    <button class="replay" onclick="restart()">↻ Try the level again</button>
  </div>

  <div class="lb" id="lb">
    <div class="lb-card">
      <div class="lb-title">Leaderboard</div>
      <div class="lb-head"><span>Rank</span><span>Name</span><span class="pr">Points</span></div>
      <div class="lb-rows" id="lbRows"></div>
      <button class="cta lb-cta" onclick="doInstall()">🏆 Win your next game</button>
      <button class="replay" onclick="restart()">↻ Play again</button>
    </div>
  </div>
</div>

<script>
const COLS=6, ROWS=7, GOAL=10, START_TIME=30, TARGET=4;
const CLICK_URL = "https://example.com/install"; // <-- replace with your store / tracking URL
const TYPES=[
  {e:'🎸', g:['#ff7a8a','#ff2e6b']},
  {e:'🎹', g:['#6fe0ff','#2e7bff']},
  {e:'🥁', g:['#ffd86b','#ff9d2e']},
  {e:'🎤', g:['#c79bff','#7a2eff']},
  {e:'🎵', g:['#7bffce','#11c98b']}, // TARGET
];
const board=document.getElementById('board');
let grid, cellEls=[], collected, hype=0, busy=false, over=false, selected=null, timeLeft=START_TIME, timerId=null, started=false;
let hintTimer=null, hintCells=[];

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rnd=()=>Math.floor(Math.random()*TYPES.length);
const sw=(a,b,c,d)=>{const t=grid[a][b];grid[a][b]=grid[c][d];grid[c][d]=t;};

/* build persistent DOM cells once */
function buildCells(){
  board.innerHTML='';
  cellEls=[];
  for(let r=0;r<ROWS;r++){cellEls[r]=[];for(let c=0;c<COLS;c++){
    const el=document.createElement('div');
    el.className='cell';
    el.addEventListener('touchstart',(e)=>cellTouchStart(e,r,c),{passive:false});
    el.addEventListener('mousedown',(e)=>cellMouseDown(e,r,c));
    board.appendChild(el); cellEls[r][c]=el;
  }}
}
function newBoard(){
  grid=[];
  for(let r=0;r<ROWS;r++){grid[r]=[];for(let c=0;c<COLS;c++){
    let t; do{t=rnd();}while(
      (c>=2&&grid[r][c-1]===t&&grid[r][c-2]===t)||
      (r>=2&&grid[r-1][c]===t&&grid[r-2][c]===t));
    grid[r][c]=t;
  }}
}
function findMatches(){
  const m=new Set();
  for(let r=0;r<ROWS;r++){let run=1;for(let c=1;c<=COLS;c++){
    const same=c<COLS&&grid[r][c]!=null&&grid[r][c]===grid[r][c-1];
    if(same)run++;else{if(run>=3)for(let k=c-run;k<c;k++)m.add(r+','+k);run=1;}
  }}
  for(let c=0;c<COLS;c++){let run=1;for(let r=1;r<=ROWS;r++){
    const same=r<ROWS&&grid[r][c]!=null&&grid[r][c]===grid[r-1][c];
    if(same)run++;else{if(run>=3)for(let k=r-run;k<r;k++)m.add(k+','+c);run=1;}
  }}
  return m;
}
function collapse(){
  const spawned=new Set();
  for(let c=0;c<COLS;c++){
    const stack=[];
    for(let r=ROWS-1;r>=0;r--) if(grid[r][c]!=null) stack.push(grid[r][c]);
    for(let r=ROWS-1;r>=0;r--){
      const k=(ROWS-1)-r;
      if(k<stack.length) grid[r][c]=stack[k];
      else{ grid[r][c]=rnd(); spawned.add(r+','+c); }
    }
  }
  return spawned;
}
function paint(r,c,spawn){
  const el=cellEls[r][c], t=grid[r][c];
  el.classList.remove('clear','sel','hint','shake');
  if(t==null){if(el._t!==null){el.style.background='transparent';el.textContent='';el._t=null;}return;}
  if(t!==el._t){
    const T=TYPES[t];
    el.style.background=`radial-gradient(circle at 32% 26%, #ffffffcc, #ffffff00 42%), linear-gradient(160deg, ${T.g[0]}, ${T.g[1]})`;
    el.textContent=T.e;
    el._t=t;
  }
  if(spawn){el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');}
}
function render(spawn){for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)paint(r,c,spawn&&spawn.has(r+','+c));}

function hasMove(){
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    if(c+1<COLS){sw(r,c,r,c+1);const ok=findMatches().size>0;sw(r,c,r,c+1);if(ok)return true;}
    if(r+1<ROWS){sw(r,c,r+1,c);const ok=findMatches().size>0;sw(r,c,r+1,c);if(ok)return true;}
  }
  return false;
}
function findHint(){
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    if(c+1<COLS){sw(r,c,r,c+1);const ok=findMatches().size>0;sw(r,c,r,c+1);if(ok)return[[r,c],[r,c+1]];}
    if(r+1<ROWS){sw(r,c,r+1,c);const ok=findMatches().size>0;sw(r,c,r+1,c);if(ok)return[[r,c],[r+1,c]];}
  }
  return null;
}
function scheduleHint(){clearTimeout(hintTimer);hintTimer=setTimeout(showHint,3200);}
function showHint(){/* idle pulse hint disabled — it made tiles blink after the first move */}

/* ---------- ONBOARDING: a ghost hand that demonstrates the drag at the start ---------- */
let firstMoveDone=false, tutorActive=false, tutorCells=null, tutorTimer=null, hand=null, tutorLoops=0;
function ensureHand(){
  if(hand)return;
  hand=document.createElement('div');hand.className='tutorhand';
  hand.innerHTML='<span class="ring"></span>';
  board.appendChild(hand);
}
function cleanupTutorial(){
  if(tutorCells){tutorCells.forEach(el=>{el.classList.remove('dragging');el.style.transition='';el.style.transform='';});tutorCells=null;}
  if(hand){hand.style.transition='opacity .15s ease';hand.style.opacity='0';hand.classList.remove('press');}
}
function cancelTutorial(){tutorActive=false;clearTimeout(tutorTimer);cleanupTutorial();}
function armTutorial(){
  if(firstMoveDone||over)return;
  clearTimeout(tutorTimer);
  tutorTimer=setTimeout(()=>{
    if(firstMoveDone||busy||over||gesture)return;
    ensureHand();tutorActive=true;tutorLoops=0;runTutorialOnce();
  },2400);
}
async function runTutorialOnce(){
  if(!tutorActive||busy||over)return cleanupTutorial();
  try{
    const h=findHint();if(!h){cleanupTutorial();return;}
    const [[ar,ac],[br,bc]]=h;
    const ca=cellEls[ar][ac], cb=cellEls[br][bc];
    tutorCells=[ca,cb]; tutorLoops++;
    const step=cellStep(), dx=Math.sign(bc-ac), dy=Math.sign(br-ar);
    const ax=ca.offsetLeft+ca.offsetWidth/2, ay=ca.offsetTop+ca.offsetHeight/2;
    hand.style.transition='none';hand.style.left=(ax-15)+'px';hand.style.top=(ay-15)+'px';hand.style.transform='translate(0,0)';
    void hand.offsetWidth;
    hand.style.transition='opacity .2s ease, transform .5s cubic-bezier(.4,0,.2,1)';hand.style.opacity='1';
    hand.classList.remove('press');void hand.offsetWidth;hand.classList.add('press');
    ca.classList.add('dragging');
    await sleep(430); if(!tutorActive)return cleanupTutorial();
    hand.style.transform=`translate(${dx*step}px,${dy*step}px)`;
    ca.style.transition='transform .5s cubic-bezier(.4,0,.2,1)';cb.style.transition='transform .5s cubic-bezier(.4,0,.2,1)';
    ca.style.transform=`translate(${dx*step}px,${dy*step}px)`;cb.style.transform=`translate(${-dx*step}px,${-dy*step}px)`;
    await sleep(620); if(!tutorActive)return cleanupTutorial();
    hand.style.opacity='0';ca.classList.remove('dragging');
    ca.style.transition='transform .26s ease';cb.style.transition='transform .26s ease';
    ca.style.transform='translate(0,0)';cb.style.transform='translate(0,0)';
    await sleep(300); if(!tutorActive)return cleanupTutorial();
    [ca,cb].forEach(el=>{el.style.transition='';el.style.transform='';});tutorCells=null;
    await sleep(750);
    if(tutorActive&&!firstMoveDone&&!busy&&!over&&!gesture&&tutorLoops<3)runTutorialOnce();
    else{tutorActive=false;cleanupTutorial();}
  }catch(err){
    tutorActive=false; cleanupTutorial();
  }
}

function setHype(v){hype=Math.max(0,Math.min(100,v));document.getElementById('hypeBar').style.width=hype+'%';}
/* ---------- SOUND (synthesized via WebAudio, no audio files) ---------- */
let actx=null, muted=false;
function audioOn(){
  try{ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
       if(actx.state==='suspended') actx.resume(); }catch(e){}
}
function toggleMute(){
  muted=!muted;
  if(!muted) audioOn();
  const b=document.getElementById('muteBtn');
  b.textContent = muted ? '🔇' : '🔊';
  b.classList.toggle('off', muted);
}
function tone(freq,dur,type,vol,when,glideTo){
  if(!actx||muted)return;
  const t=when||actx.currentTime;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(freq,t);
  if(glideTo) o.frequency.exponentialRampToValueAtTime(Math.max(1,glideTo), t+dur);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol||0.18, t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t+dur+0.03);
}
const SCALE=[392,440,523,587,659,784];               // a note per instrument type
function sndSwap(){ tone(520,0.07,'triangle',0.12,0,640); }
function sndInvalid(){ tone(150,0.13,'sawtooth',0.12,0,90); }
function sndMatch(type,cascade){
  if(!actx)return; const t=actx.currentTime;
  const base=SCALE[type%SCALE.length]*(cascade>=2?1.5:1);
  tone(base,0.16,'triangle',0.17,t);
  tone(base*1.5,0.16,'sine',0.09,t);
  if(cascade>=2) tone(base*2,0.12,'sine',0.07,t+0.04);
}
function sndWin(){
  if(!actx)return; const t=actx.currentTime, seq=[523,659,784,1047];
  seq.forEach((f,i)=>{ tone(f,0.24,'triangle',0.2,t+i*0.13); tone(f/2,0.24,'sine',0.07,t+i*0.13); });
  tone(1568,0.5,'sine',0.12,t+seq.length*0.13);
}
function sndLand(){ if(!actx)return; const t=actx.currentTime; tone(880,0.12,'triangle',0.18,t); tone(1320,0.2,'sine',0.12,t+0.06); }
function sndTick(last){ tone(last?1320:880, 0.08, 'square', last?0.18:0.1); }
function sndCta(){ if(!actx)return; const t=actx.currentTime; tone(660,0.06,'square',0.12,t); tone(990,0.09,'square',0.1,t+0.05); }

function flash(){const f=document.getElementById('flash');f.classList.remove('go');void f.offsetWidth;f.classList.add('go');}

/* ---------- MATCH CELEBRATION ---------- */
function burstAt(cx,cy,color){
  const ring=document.createElement('div');ring.className='fx-ring';
  ring.style.left=cx+'px';ring.style.top=cy+'px';ring.style.borderColor=color;
  board.appendChild(ring);setTimeout(()=>ring.remove(),520);
  const glyphs=['✨','🎵','⭐','🔥'];const N=5;
  for(let i=0;i<N;i++){
    const p=document.createElement('div');
    const glyph=i%2===0;
    p.className='fx-spark'+(glyph?' glyph':'');
    const ang=(Math.PI*2*i/N)+Math.random()*0.7;
    const dist=32+Math.random()*42;
    p.style.left=cx+'px';p.style.top=cy+'px';
    p.style.setProperty('--tx',(Math.cos(ang)*dist)+'px');
    p.style.setProperty('--ty',(Math.sin(ang)*dist+18)+'px');     // slight gravity drift
    p.style.setProperty('--rot',((Math.random()*360)|0)+'deg');
    if(glyph)p.textContent=glyphs[(Math.random()*glyphs.length)|0];
    else p.style.background=color;
    board.appendChild(p);setTimeout(()=>p.remove(),700);
  }
}
function celebrate(cells, size, cascade){
  let cx=0,cy=0;
  cells.forEach(([r,c,t])=>{
    const el=cellEls[r][c];
    const x=el.offsetLeft+el.offsetWidth/2, y=el.offsetTop+el.offsetHeight/2;
    cx+=x;cy+=y;
    burstAt(x,y,(TYPES[t]&&TYPES[t].g[0])||'#fff');
  });
  cx/=cells.length;cy/=cells.length;
  const tier = cascade>=3?3 : cascade>=2?2 : (size>=5?2 : size>=4?1 : 0);
  if(tier>0){                                   // praise text only for the bigger moments
    const words=['','Nice!','Combo!','On fire!'];
    const label=document.createElement('div');label.className='fx-combo';
    label.textContent=words[tier];
    label.style.left=cx+'px';label.style.top=(cy-8)+'px';label.style.fontSize=(22+tier*7)+'px';
    board.appendChild(label);setTimeout(()=>label.remove(),1000);
  }
  if(navigator.vibrate){try{navigator.vibrate(tier>=2?[14,26,14]:10);}catch(e){}}
}
function fmtTime(s){s=Math.max(0,s|0);const m=(s/60)|0,ss=s%60;return m+':'+(ss<10?'0':'')+ss;}
function updateHUD(){
  document.getElementById('time').textContent=fmtTime(timeLeft);
  document.getElementById('col').textContent=Math.min(collected,GOAL);
  document.getElementById('hypeBar').style.width=Math.min(100,(collected/GOAL)*100)+'%';
  document.getElementById('timeChip').classList.toggle('low',timeLeft<=5);
  document.getElementById('targetChip').classList.toggle('done',collected>=GOAL);
}
function startTimer(){
  if(started||over)return;
  started=true;
  timerId=setInterval(()=>{
    if(over){clearInterval(timerId);timerId=null;return;}
    timeLeft--; updateHUD();
    if(timeLeft<=5 && timeLeft>0) sndTick(timeLeft<=3);
    if(timeLeft<=0){clearInterval(timerId);timerId=null;endGame(collected>=GOAL,'time');}
  },1000);
}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null;}}

async function resolve(){
  let cascade=0;
  while(true){
    const m=findMatches();
    if(m.size===0)break;
    cascade++;
    const cells=[];
    m.forEach(key=>{const[r,c]=key.split(',').map(Number);
      cells.push([r,c,grid[r][c]]);
      cellEls[r][c].classList.add('clear');});
    collected++; updateHUD();                 // +1 for each match (also fills the bar)
    sndMatch(cells[0]?cells[0][2]:0, cascade);
    celebrate(cells, m.size, cascade);
    await sleep(150);
    m.forEach(key=>{const[r,c]=key.split(',').map(Number);grid[r][c]=null;});
    const spawned=collapse();
    render(spawned);
    if(cascade>=2)flash();
    updateHUD();
    await sleep(80);
  }
}

/* ---------- INPUT: drag-to-swap with live preview (mobile) + tap fallback (desktop) ---------- */
let gesture=null;

function cellStep(){
  const a=cellEls[0][0].getBoundingClientRect();
  const b=cellEls[0][1].getBoundingClientRect();
  return b.left-a.left;                 // centre-to-centre = cell width + gap
}
function setT(el,trans,transform){el.style.transition=trans;el.style.transform=transform;}

function inStart(r,c,x,y){
  if(busy||over)return;
  audioOn();
  cancelTutorial();
  startTimer();
  gesture={r,c,x,y,dir:null,nb:null,px:0,amt:0,dragging:false};
  clearHint();
}
function inMove(x,y){
  if(!gesture||busy||over)return;
  const dx=x-gesture.x, dy=y-gesture.y;
  const adx=Math.abs(dx), ady=Math.abs(dy);

  if(!gesture.dir){
    if(Math.max(adx,ady)<7)return;                  // dead-zone before a drag starts
    let ddx=0,ddy=0;
    if(adx>ady) ddx=dx>0?1:-1; else ddy=dy>0?1:-1;
    const nr=gesture.r+ddy, nc=gesture.c+ddx;
    if(nr<0||nr>=ROWS||nc<0||nc>=COLS){gesture.dir='edge';return;} // no neighbour that way
    gesture.dir={dx:ddx,dy:ddy};
    gesture.nb={r:nr,c:nc};
    gesture.px=cellStep();
    gesture.dragging=true;
    if(selected){cellEls[selected.r][selected.c].classList.remove('sel');selected=null;}
    cellEls[gesture.r][gesture.c].classList.add('dragging');
    cellEls[nr][nc].classList.add('dragging');
  }
  if(gesture.dir==='edge'||!gesture.dragging)return;

  const proj = gesture.dir.dx!==0 ? dx*gesture.dir.dx : dy*gesture.dir.dy;
  const amt = Math.max(0, Math.min(gesture.px, proj));   // follow finger, clamped to one cell
  gesture.amt=amt;
  const ddx=gesture.dir.dx, ddy=gesture.dir.dy;
  cellEls[gesture.r][gesture.c].style.transform=`translate(${ddx*amt}px,${ddy*amt}px)`;
  cellEls[gesture.nb.r][gesture.nb.c].style.transform=`translate(${-ddx*amt}px,${-ddy*amt}px)`;
}
function inEnd(){
  if(!gesture)return;
  const g=gesture; gesture=null;
  if(g.dragging){
    if(g.amt>=g.px*0.5) commitSwap({r:g.r,c:g.c}, g.nb, g.dir);  // past halfway → swap
    else revertDrag(g);                                          // not enough → snap back
  }else if(g.dir!=='edge'){
    onCell(g.r,g.c);                                             // a tap, not a drag
  }
}

/* Touch input (mobile / in-app webviews) */
function cellTouchStart(e,r,c){
  if(gesture)return;                       // ignore extra fingers
  if(e.cancelable)e.preventDefault();      // stop scroll/zoom + synthetic mouse events
  const t=e.changedTouches[0]; if(!t)return;
  inStart(r,c,t.clientX,t.clientY);
}
window.addEventListener('touchmove',(e)=>{
  if(!gesture)return;
  if(e.cancelable)e.preventDefault();
  const t=e.changedTouches[0]; if(t)inMove(t.clientX,t.clientY);
},{passive:false});
window.addEventListener('touchend',inEnd);
window.addEventListener('touchcancel',()=>{if(gesture&&gesture.dragging)revertDrag(gesture);gesture=null;});

/* Mouse input (desktop) */
function cellMouseDown(e,r,c){ inStart(r,c,e.clientX,e.clientY); }
window.addEventListener('mousemove',(e)=>{ if(gesture)inMove(e.clientX,e.clientY); });
window.addEventListener('mouseup',inEnd);

function revertDrag(g){
  const ca=cellEls[g.r][g.c], cb=cellEls[g.nb.r][g.nb.c];
  ca.classList.remove('dragging'); cb.classList.remove('dragging');
  setT(ca,'transform .16s ease','translate(0,0)');
  setT(cb,'transform .16s ease','translate(0,0)');
  setTimeout(()=>{ca.style.transition='';ca.style.transform='';cb.style.transition='';cb.style.transform='';},180);
  scheduleHint();
}
async function commitSwap(a,b,dir){
  busy=true; clearHint();
  const ca=cellEls[a.r][a.c], cb=cellEls[b.r][b.c];
  try{
    const px=cellStep();
    setT(ca,'transform .1s ease',`translate(${dir.dx*px}px,${dir.dy*px}px)`);   // finish the slide
    setT(cb,'transform .1s ease',`translate(${-dir.dx*px}px,${-dir.dy*px}px)`);
    await sleep(105);
    sw(a.r,a.c,b.r,b.c);
    const valid=findMatches().size>0;
    ca.classList.remove('dragging'); cb.classList.remove('dragging');
    if(!valid){
      sndInvalid();
      sw(a.r,a.c,b.r,b.c);                              // undo: no match
      setT(ca,'transform .15s ease','translate(0,0)');
      setT(cb,'transform .15s ease','translate(0,0)');
      await sleep(160);
      ca.style.transition='';ca.style.transform='';cb.style.transition='';cb.style.transform='';
      [ca,cb].forEach(el=>{el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');});
    }else{
      sndSwap();
      // valid: clear transforms with no animation; data already swapped so positions line up
      ca.style.transition='none';cb.style.transition='none';
      ca.style.transform='none';cb.style.transform='none';
      void ca.offsetWidth;
      ca.style.transition='';cb.style.transition='';
      render();
      firstMoveDone=true; cancelTutorial();
      startTimer(); updateHUD();
      await resolve();
      if(collected>=GOAL)endGame(true);
    }
  }catch(err){
    [ca,cb].forEach(el=>{el.classList.remove('dragging','shake');el.style.transition='';el.style.transform='';});
    try{render();}catch(_){}
  }finally{
    busy=false;
    if(!over) scheduleHint();
  }
}

function onCell(r,c){
  if(busy||over)return;
  clearHint();
  if(!selected){selected={r,c};cellEls[r][c].classList.add('sel');scheduleHint();return;}
  const a=selected;cellEls[a.r][a.c].classList.remove('sel');
  if(a.r===r&&a.c===c){selected=null;return;}
  const adj=Math.abs(a.r-r)+Math.abs(a.c-c)===1;
  if(!adj){selected={r,c};cellEls[r][c].classList.add('sel');scheduleHint();return;}
  selected=null;doSwap(a,{r,c});
}
async function doSwap(a,b){
  busy=true;
  try{
    sw(a.r,a.c,b.r,b.c);render();await sleep(130);
    if(findMatches().size===0){
      sndInvalid();
      sw(a.r,a.c,b.r,b.c);render();
      [a,b].forEach(p=>{const el=cellEls[p.r][p.c];el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');});
      return;
    }
    sndSwap();
    firstMoveDone=true; cancelTutorial();
    startTimer(); updateHUD();
    await resolve();
    if(collected>=GOAL)endGame(true);
  }catch(err){
    try{render();}catch(_){}
  }finally{
    busy=false;
    if(!over)scheduleHint();
  }
}

/* ---------- END CARD ---------- */
function endGame(win, reason){
  if(over)return;
  over=true; stopTimer(); clearHint(); cancelTutorial();
  if(win){
    bigWin();
    setTimeout(showLeaderboard, 1300);   // salute first, then the leaderboard slides up
    return;
  }
  const timeUp = reason==='time';
  document.getElementById('endTitle').textContent = timeUp ? "Time's Up!" : 'One More Encore?';
  document.getElementById('endSub').textContent = "Time's up — install free to keep the show going.";
  document.getElementById('cta').textContent = '▶ Keep Playing';
  document.getElementById('end').classList.add('show');
}

  do{newBoard();}while(!hasMove());
  render();updateHUD();
  const intro=document.getElementById('intro');intro.classList.remove('show');void intro.offsetWidth;intro.classList.add('show');
  ensureHand(); armTutorial();
}

function fit(){
  const stage=document.querySelector('.stage'); if(!stage)return;
  const availW=stage.clientWidth - (parseFloat(getComputedStyle(stage).paddingLeft)+parseFloat(getComputedStyle(stage).paddingRight));
  const availH=stage.clientHeight - (parseFloat(getComputedStyle(stage).paddingTop)+parseFloat(getComputedStyle(stage).paddingBottom));
  if(availW<=0||availH<=0)return;
  const AR=6/7;                              // width / height
  let w=availW, h=w/AR;
  if(h>availH){ h=availH; w=h*AR; }          // height-bound (landscape / short screens)
  w=Math.floor(w); h=Math.floor(h);
  board.style.width=w+'px'; board.style.height=h+'px';
  const innerW=w-16-30;                       // minus board padding (8*2) and 5 gaps*6
  document.documentElement.style.setProperty('--sym', Math.max(14, (innerW/6)*0.6)+'px');
}
let fitRAF=null;
function scheduleFit(){ if(fitRAF)cancelAnimationFrame(fitRAF); fitRAF=requestAnimationFrame(fit); }
window.addEventListener('resize', scheduleFit);
window.addEventListener('orientationchange', ()=>setTimeout(fit,200));

document.getElementById('goal').textContent=GOAL;
buildCells();
fit();
start();
window.addEventListener('load', fit);
</script>
